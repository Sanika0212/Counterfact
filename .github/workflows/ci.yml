name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Create environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[viz]" --group dev
      - name: Lint
        run: |
          uv run --no-sync ruff check src tests scripts examples
          uv run --no-sync ruff format --check src tests scripts examples
      - name: Type check
        run: uv run --no-sync mypy
      - name: Test
        run: uv run --no-sync pytest --cov --cov-report=term-missing --cov-fail-under=85
      - name: Demo (find the culprit in a built-in failing agent)
        run: uv run --no-sync counterfact demo --out demo
      - name: FaultBench smoke run
        run: uv run --no-sync counterfact bench --per-family 6 --methods last suspicion blame bisect --out bench
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: demo-report
          path: demo/report.html

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
